name: pr

on: [pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    # Gate the test run behind a successful build so compilation errors fail
    # fast with a clear signal before the test phase runs.
    - name: Build
      run: go build ./...
    - name: Run tests
      run: go test ./...

  cyclo:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Run gocyclo
      run: go generate ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Build the e2e tests stack
      run: (cd demo && docker compose up -d)
    - name: e2e tests
      run: sleep 5; bash ./tests/e2e.sh

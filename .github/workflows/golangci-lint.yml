name: golangci-lint
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Build golangci-lint from source with the same Go toolchain as the module
      # so its language version matches the go.mod directive. The prebuilt
      # release binaries (and the golangci-lint-action) lag behind new Go
      # releases and refuse to lint a module that targets a newer Go than the one
      # they were built with.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Run golangci-lint
        run: golangci-lint run ./...
